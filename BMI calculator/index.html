<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>BMI calculator</title>
    <link rel='stylesheet' href='style.css'>

</head>

<body>

    <div class="bmi-container">
        <header>
            <h3>Body Mass Index (BMI) calculator</h3>
        </header>
        <p>Your height (cm):</p>
        <input type="number" class="container" id="height" value="180" placeholder="enter your height in cm">
        <p>Your Weight (kg):</p>
        <input type="number" class="container" id="Weight" value="80" placeholder="Enter your weight in kg"><br>
        <input type="button" value="Compute BMI" class="btn"><br>
        <input disabled type="number" class="container">
        <h4 class="info-text">Weight condition:
            <span id="weight condition"></span>
        </h4>
    </div>

</body>

</html>
