<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form class="form">
        <input type="text" placeholder="Enter your task" class="input" autocomplete="off">
        <ul class="list">
            <li class="checked">Buy Milk<i class="fa-regular fa-check-square"></i>
            <i class="fa-solid fa-trash-can"></i></li>
            <li>Call Mom<i class="fa-regular fa-check-square"></i>
            <i class="fa-solid fa-trash-can"></i></li>
        </ul>
    </form>
</body>
</html>
