<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up</title>
</head>

<body>
    <div class="container">
        <form action="" method="post">
            <h1>Sign Up</h1>
            <div class="input_container">
                <input type="text" id="first-name" placeholder="First name" class="input">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="last-name" placeholder="Last name" class="input">
                <input type="text" id="email" placeholder="Email" class="input">
                <input type="text" id="password" placeholder="Password" class="input"><br>
                <button class="btn">login</button>
            </div>
        </form>
    </div>
</body>

</html>
