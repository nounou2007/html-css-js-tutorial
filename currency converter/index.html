<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Currency converter</title>
    <link rel='stylesheet' href='style.css'>

</head>

<body>
    <div class="container">
        <h2>Currency converter</h2>
        <div class="currency-container">
            <select id="Currency-first">
                <option value="AUD">AUD</option>
                <option value="CAD">CQD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="INR">INR</option>
                <option value="JPY">JPY</option>
                <option value="USD" selected>USD</option>
            </select>
            <input type="number" id="worth-first" value="1" min="0">
        </div>

        <div class="currency-container">
            <select id="Currency-second">
                <option value="AUD">AUD</option>
                <option value="CAD">CQD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="INR" selected>INR</option>
                <option value="JPY">JPY</option>
                <option value="USD">USD</option>
            </select>
            <input type="number" id="worth-second" disabled>
        </div>
        <P class="exchange-rate" id="exchange-rate">1 USD = 128.5802 JPY</P>
    </div>

</body>

</html>
